<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#172235;--muted:#718096;--line:#e4eaf1;--navy:#101a2b;--navy2:#192840;--blue:#1677e8;--cyan:#36c5d9;--green:#13966a;--red:#d94b57;--amber:#c98216;--shadow:0 12px 35px #15243a0d;--r:16px;--display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px var(--body)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
.side{background:var(--navy);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-size:20px;font-weight:800}
.brand strong{font:800 24px var(--display);letter-spacing:.3px}
.brand small{display:block;color:#8fa2bc;font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
.navlabel{color:#71839d;font-size:10px;font-weight:800;letter-spacing:1.4px;padding:0 12px;margin:6px 0}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:12px;border-radius:11px;display:flex;align-items:center;gap:12px;font-weight:600}
.nav button:hover,.nav button.active{background:#20334f;color:#fff}
.nav .ico{width:20px;text-align:center;font-size:17px}
.sidefoot{margin-top:auto;border-top:1px solid #293a52;padding:15px 8px;color:#8293aa;font-size:11px;line-height:1.6}
.main{min-width:0}
.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink)}
.topright{display:flex;align-items:center;gap:10px}
.pill{background:#eaf4ff;color:#1769c2;border-radius:30px;padding:7px 11px;font-size:11px;font-weight:800}
.avatar{width:34px;height:34px;border-radius:50%;background:#e7eff9;color:#245c9c;display:grid;place-items:center;font-weight:800}
.content{max-width:1440px;margin:auto;padding:30px 32px 90px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:24px}
.eyebrow{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:800}
.pagehead h1{font:800 34px var(--display);margin:4px 0}
.sub{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#b7c8dc}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.danger{color:var(--red)}
.btn.small{padding:7px 10px;font-size:12px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:19px}
.stat{display:flex;justify-content:space-between;align-items:flex-start}
.stat .label{color:var(--muted);font-size:12px;font-weight:600}
.stat .value{font:800 32px var(--display);margin-top:8px}
.stat .hint{font-size:11px;color:var(--muted);margin-top:3px}
.stat .symbol{width:38px;height:38px;border-radius:12px;background:#eaf3ff;color:var(--blue);display:grid;place-items:center;font-size:18px}
.cols{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.cardhead h3{margin:0;font-size:14px}
.muted{color:var(--muted)}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th{text-align:left;color:#8491a3;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:11px 10px;border-bottom:1px solid var(--line)}
td{padding:13px 10px;border-bottom:1px solid #edf1f5;font-size:12px;vertical-align:top}
tr:last-child td{border-bottom:0}
.tag{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800;background:#edf1f6;color:#64748b;white-space:nowrap}
.tag.aprovado,.tag.ativo,.tag.concluido{background:#e5f7ef;color:#13845d}
.tag.enviado,.tag.programado{background:#eaf3ff;color:#1769c2}
.tag.recusado,.tag.vencido{background:#fff0f0;color:#c23e49}
.tag.rascunho,.tag.pendente{background:#fff5e5;color:#a66a0b}
.empty{padding:34px 15px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:5px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.toolbar select{width:auto;border:1px solid #dfe6ee;background:#fff;border-radius:9px;padding:11px 12px;color:var(--ink)}
.field{display:grid;gap:6px;margin-bottom:13px}
.field label{font-size:11px;font-weight:800;color:#66758a}
.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dfe6ee;background:#fff;border-radius:9px;padding:11px 12px;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1677e814}
.field textarea{min-height:80px;resize:vertical}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.span2{grid-column:span 2}
.formh{margin:18px 0 10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue)}
.modalback{position:fixed;inset:0;background:#08132388;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}
.modalback.show{display:flex}
.modal{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px;box-shadow:0 25px 80px #0003}
.modal.wide{width:min(900px,100%)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.modalhead h2{font:800 25px var(--display);margin:0}
.x{border:0;background:#eef2f6;border-radius:8px;width:32px;height:32px;flex:none}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.itemrow{display:grid;grid-template-columns:1fr 70px 64px 110px 36px;gap:7px;margin-bottom:8px}
.itemrow input{min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.taskrow{display:grid;grid-template-columns:1fr 130px 36px;gap:7px;margin-bottom:8px}
.taskrow input,.taskrow select{min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;background:#fff}
.totals{margin-left:auto;max-width:280px;display:grid;gap:8px;padding-top:12px}
.totalrow{display:flex;justify-content:space-between;color:var(--muted)}
.totalrow strong{color:var(--ink)}
.totalrow.final{font-size:17px;border-top:1px solid var(--line);padding-top:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#15243a;color:#fff;padding:12px 17px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:40;box-shadow:0 10px 30px #0003;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mobilebar{display:none}
.sectionnote{padding:13px 15px;background:#eef6ff;border:1px solid #d7eaff;color:#285c91;border-radius:11px;font-size:12px;line-height:1.5;margin-bottom:15px}
.sectionnote.warn{background:#fff7e8;border-color:#f6dfae;color:#8a5a0a}
.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.detailbox{padding:13px;background:#f7f9fc;border-radius:10px}
.detailbox small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
.detailbox b{font-size:13px}
.inline-actions{display:flex;gap:6px;flex-wrap:wrap}
.logo-preview{max-width:150px;max-height:70px;object-fit:contain;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:6px}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.check input{width:18px;height:18px;margin:2px 0 0;flex:none}
.statusbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.statusbar button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-weight:700;font-size:12px;color:var(--muted)}
.statusbar button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filterchip{display:inline-flex;align-items:center;gap:8px;background:#eaf4ff;color:#1769c2;border-radius:30px;padding:7px 8px 7px 12px;font-size:12px;font-weight:700;margin-bottom:15px}
.filterchip button{border:0;background:#cfe4fb;border-radius:50%;width:22px;height:22px;color:#1769c2;font-weight:800}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;font-size:13px;color:var(--ink)}
.dochead{display:flex;justify-content:space-between;gap:18px;border-bottom:2px solid var(--blue);padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap}
.dochead-l{display:flex;gap:14px;align-items:center;min-width:0}
.doclogo{max-height:56px;max-width:140px;object-fit:contain}
.docco{font:800 24px var(--display);text-transform:uppercase;letter-spacing:.3px;overflow-wrap:anywhere}
.docsm{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.dochead-r{text-align:right}
.doctitle{font:800 26px var(--display);letter-spacing:2px;color:var(--blue)}
.docgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:6px}
.docgrid>div{min-width:0;overflow-wrap:anywhere}
.doc small.lb{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.docsec{margin-top:18px}
.docsec h4{margin:0 0 6px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);border-bottom:1px solid var(--line);padding-bottom:4px}
.doc table{min-width:0}
.doc td,.doc th{padding:9px 8px}
.doc .r{text-align:right;white-space:nowrap}
.docsig{margin-top:38px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.docsig div{border-top:1px solid var(--ink);padding-top:6px;min-width:200px;flex:1;font-size:12px}
.docnote{color:var(--muted);font-size:11px;margin-top:14px}
@media(max-width:900px){
.shell{grid-template-columns:1fr}
.side{display:none}
.top{padding:0 18px}
.content{padding:22px 17px 100px}
.stats{grid-template-columns:repeat(2,1fr)}
.cols{grid-template-columns:minmax(0,1fr)}
.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}
.mobilebar button{border:0;background:none;color:#718096;font-size:10px;display:grid;gap:3px;justify-items:center;min-width:52px}
.mobilebar button.active{color:var(--blue);font-weight:800}
.mobilebar span{font-size:18px}
.pagehead{align-items:center}
.pagehead h1{font-size:29px}
}
@media(max-width:560px){
.top{height:58px}
.pill{display:none}
.content{padding:18px 13px 100px}
.stats{gap:9px}
.card{padding:14px}
.stat .value{font-size:27px}
.formgrid{grid-template-columns:1fr}
.span2{grid-column:auto}
.detailgrid{grid-template-columns:1fr 1fr}
.itemrow{grid-template-columns:1fr 1fr 1.4fr 36px}
.itemrow .desc{grid-column:1/-1}
.taskrow{grid-template-columns:1fr 108px 36px}
.pagehead{display:block}
.pagehead .actions{margin-top:13px}
.toolbar .search{min-width:100%}
.docgrid{grid-template-columns:1fr}
.dochead-r{text-align:left}
.modal{padding:16px}
.modalfoot .btn{flex:1 1 auto;justify-content:center}
}
</style>
</head>

<script>
const WN=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584,761,556,556,222,556,333,1000,556,556,333,1000,667,333,1000,556,611,556,556,222,222,333,333,350,556,1000,333,1000,500,333,944,556,500,667,278,333,556,556,556,556,260,556,333,737,370,556,584,333,737,333,400,584,333,333,333,556,537,278,333,333,365,556,834,834,834,611,667,667,667,667,667,667,1000,722,667,667,667,667,278,278,278,278,722,722,778,778,778,778,778,584,778,722,722,722,722,667,667,611,556,556,556,556,556,556,889,500,556,556,556,556,278,278,278,278,556,556,556,556,556,556,556,584,611,556,556,556,556,500,556,500];
const WB=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584,761,556,556,278,556,500,1000,556,556,333,1000,667,333,1000,556,611,556,556,278,278,500,500,350,556,1000,333,1000,556,333,944,556,500,667,278,333,556,556,556,556,280,556,333,737,370,556,584,333,737,333,400,584,333,333,333,611,556,278,333,333,365,556,834,834,834,611,722,722,722,722,722,722,1000,722,667,667,667,667,278,278,278,278,722,722,778,778,778,778,778,584,778,722,722,722,722,667,667,611,556,556,556,556,556,556,889,556,556,556,556,556,278,278,278,278,611,611,611,611,611,611,611,584,611,611,611,611,611,556,611,556];

/* ======================= Gerador de PDF próprio (sem biblioteca externa) ======================= */
const WIN={0x2013:0x96,0x2014:0x97,0x2022:0x95,0x2026:0x85,0x201C:0x93,0x201D:0x94,0x2018:0x91,0x2019:0x92,0x20AC:0x80,0x2122:0x99};
function winCode(ch){let c=ch.charCodeAt(0);if(c<32)return 32;if(c<256&&!(c>=128&&c<160))return c;return WIN[c]||63}
class Pdf{
 constructor(title){this.k=72/25.4;this.title=title||'Documento';this.pages=[];this.images=[];this.font=0;this.size=10;this.tc=[0,0,0];this.fc=[0,0,0];this.dc=[0,0,0];this.addPage()}
 addPage(){this.cur={ops:[],imgs:[]};this.pages.push(this.cur)}
 n(v){return (Math.round(v*100)/100).toString()}
 rgb(c){return c.map(v=>(v/255).toFixed(3)).join(' ')}
 setFont(bold){this.font=bold?1:0}
 setSize(s){this.size=s}
 setText(c){this.tc=c}
 setFill(c){this.fc=c}
 setDraw(c){this.dc=c}
 w(str,size){const T=this.font?WB:WN;let t=0;for(const ch of String(str)){const c=winCode(ch);t+=(c>=32?T[c-32]:556)}return t*(size||this.size)/1000/this.k}
 split(str,maxW){
  const out=[];
  for(const para of String(str==null?'':str).split(/\r?\n/)){
   const words=para.split(/\s+/).filter(Boolean);let line='';
   if(!words.length){out.push('');continue}
   for(let word of words){
    while(this.w(word)>maxW&&word.length>1){let k=word.length-1;while(k>1&&this.w(word.slice(0,k))>maxW)k--;if(line){out.push(line);line=''}out.push(word.slice(0,k));word=word.slice(k)}
    const t=line?line+' '+word:word;
    if(this.w(t)<=maxW)line=t;else{out.push(line);line=word}
   }
   if(line)out.push(line);
  }
  return out;
 }
 esc(str){let s='';for(const ch of String(str)){const c=winCode(ch);s+=(c===40||c===41||c===92)?'\\'+String.fromCharCode(c):String.fromCharCode(c)}return s}
 text(str,x,y,o){
  o=o||{};let px=x;const wd=this.w(str);
  if(o.align==='right')px=x-wd;else if(o.align==='center')px=x-wd/2;
  this.cur.ops.push('BT /F'+(this.font+1)+' '+this.n(this.size)+' Tf '+this.rgb(this.tc)+' rg '+this.n(px*this.k)+' '+this.n((297-y)*this.k)+' Td ('+this.esc(str)+') Tj ET');
 }
 line(x1,y1,x2,y2,lw){this.cur.ops.push(this.n((lw||0.3)*this.k)+' w '+this.rgb(this.dc)+' RG '+this.n(x1*this.k)+' '+this.n((297-y1)*this.k)+' m '+this.n(x2*this.k)+' '+this.n((297-y2)*this.k)+' l S')}
 rect(x,y,w,h){this.cur.ops.push(this.rgb(this.fc)+' rg '+this.n(x*this.k)+' '+this.n((297-y-h)*this.k)+' '+this.n(w*this.k)+' '+this.n(h*this.k)+' re f')}
 image(img,x,y,w,h){
  let i=this.images.indexOf(img);if(i<0){this.images.push(img);i=this.images.length-1}
  if(this.cur.imgs.indexOf(i)<0)this.cur.imgs.push(i);
  this.cur.ops.push('q '+this.n(w*this.k)+' 0 0 '+this.n(h*this.k)+' '+this.n(x*this.k)+' '+this.n((297-y-h)*this.k)+' cm /Im'+(i+1)+' Do Q');
 }
 output(){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const bin=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
  const push=p=>{const u=typeof p==='string'?bin(p):p;parts.push(u);len+=u.length};
  const obj=(id,body)=>{offs[id]=len;push(id+' 0 obj\n');if(Array.isArray(body))body.forEach(push);else push(body);push('\nendobj\n')};
  const ni=this.images.length,first=5+ni;
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+this.pages.map((p,i)=>(first+i*2)+' 0 R').join(' ')+'] /Count '+this.pages.length+' >>');
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  this.images.forEach((im,i)=>obj(5+i,['<< /Type /XObject /Subtype /Image /Width '+im.width+' /Height '+im.height+' /ColorSpace '+(im.comps===1?'/DeviceGray':'/DeviceRGB')+' /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n',im.bytes,'\nendstream']));
  this.pages.forEach((p,i)=>{
   const id=first+i*2,xo=p.imgs.map(j=>'/Im'+(j+1)+' '+(5+j)+' 0 R').join(' ');
   obj(id,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>'+(xo?' /XObject << '+xo+' >>':'')+' >> /Contents '+(id+1)+' 0 R >>');
   const c=bin(p.ops.join('\n'));
   obj(id+1,['<< /Length '+c.length+' >>\nstream\n',c,'\nendstream']);
  });
  const infoId=first+this.pages.length*2;
  obj(infoId,'<< /Title ('+this.esc(this.title)+') /Producer (OrcaFrio) >>');
  const total=infoId+1,xr=len;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+total+' /Root 1 0 R /Info '+infoId+' 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  const out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length}
  return out;
 }
}
function parseJpeg(u8){
 let i=2;
 while(i<u8.length){
  if(u8[i]!==255){i++;continue}
  const m=u8[i+1];
  if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return{height:(u8[i+5]<<8)|u8[i+6],width:(u8[i+7]<<8)|u8[i+8],comps:u8[i+9]};
  i+=2+((u8[i+2]<<8)|u8[i+3]);
 }
 throw new Error('jpeg');
}

function act(a,id){

 case 'goto-quotes':return nav('orcamentos');
 case 'goto-pmoc':return nav('pmoc');
 case 'goto-company':return nav('empresa');
 case 'new-quote':return quoteForm();
 case 'edit-quote':return quoteForm(db.orcamentos.find(x=>x.id===id));
 case 'view-quote':return viewQuote(db.orcamentos.find(x=>x.id===id));
 case 'del-quote':return delQuote(db.orcamentos.find(x=>x.id===id));
 case 'new-client':return clientForm();
 case 'edit-client':return clientForm(client(id));
 case 'del-client':return delClient(client(id));
 case 'client-history':return go('historico',{clienteId:id});
 case 'new-equipment':return equipmentForm();
 case 'edit-equipment':return equipmentForm(equipmentBy(id));
 case 'del-equipment':return delEquipment(equipmentBy(id));
 case 'equipment-history':return go('historico',{equipId:id});
 case 'new-service':return serviceForm();
 case 'edit-service':return serviceForm(db.servicos.find(x=>x.id===id));
 case 'del-service':return confirmBox('Excluir este serviço do catálogo? Orçamentos já feitos não mudam.','Excluir',()=>{db.servicos=db.servicos.filter(x=>x.id!==id);persist();render();notify('Serviço excluído.')});
 case 'load-services':return loadServices();
 case 'new-pmoc':return pmocForm();
 case 'edit-pmoc':return pmocForm(db.pmocs.find(x=>x.id===id));
 case 'view-pmoc':return viewPmoc(db.pmocs.find(x=>x.id===id));
 case 'del-pmoc':return delPmoc(db.pmocs.find(x=>x.id===id));
 case 'pmoc-record':return recordForm(db.pmocs.find(x=>x.id===id));
 case 'del-history':return delHistory(db.historico.find(x=>x.id===id));
 case 'clear-filter':hf={};return render();
 case 'save-company':collectCompany();if(persist()){render();notify('Dados da empresa salvos!')}return;
 case 'remove-logo':db.empresa.logo='';persist();render();return;
 case 'export-backup':return exportBackup();
 case 'copy-backup':return copyText(JSON.stringify(db),'Backup copiado. Cole e guarde em um lugar seguro.');
 case 'import-backup':return importFile();
 case 'import-paste':return restoreFrom($('#backuptext').value);
 }
}

const logoCache={};
function logoJpeg(){
 const src=db.empresa.logo;if(!src)return Promise.resolve(null);
 if(logoCache.src===src)return Promise.resolve(logoCache.v);
 return new Promise(res=>{
  const im=new Image();
  im.onload=()=>{try{
   const sc=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
   const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
   const b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
   const info=parseJpeg(u);logoCache.src=src;logoCache.v={bytes:u,width:info.width,height:info.height,comps:info.comps};res(logoCache.v)
  }catch(e){res(null)}};
  im.onerror=()=>res(null);im.src=src;
 });
}

 }

   p.setDraw(C_LN);p.line(M,this.y+h,R,this.y+h,0.2);this.y+=h;

  this.y+=12;

   rtNome:$('#f-rtnome').value.trim(),rtCons:$('#f-rtcons').value,rtReg:$('#f-rtreg').value.trim(),rtTipo:$('#f-rttipo').value,rtNum:$('#f-rtnum').value.trim(),
   equipIds:[...sel],tarefas:tarefas.filter(t=>String(t.desc||'').trim()).map(t=>({desc:t.desc.trim(),freq:t.freq})),obs:$('#f-obs').value.trim(),status:'ativo'};
  if(!x.numero){db.seq.pmoc++;x.numero='PMOC-'+pad(db.seq.pmoc)}
  if(p)Object.assign(p,x);else db.pmocs.push(x);
  if(persist()){const r=p||x;render();notify('Plano salvo!');viewPmoc(r)}}}],
 onOpen:()=>{
  const drawEq=()=>{
   const cid=$('#f-cliente').value,list=db.equipamentos.filter(x=>x.clienteId===cid);
   $('#equipchecks').innerHTML=!cid?'<div class="muted">Escolha o cliente para listar os equipamentos dele.</div>':list.length?'<div class="checks">'+list.map(x=>'<label class="check"><input type="checkbox" data-eq="'+x.id+'"'+(sel.has(x.id)?' checked':'')+'><span><b>'+esc(x.nome)+'</b><br><span class="muted">'+esc([x.tipo,x.marca,x.modelo].filter(Boolean).join(' · '))+' · '+fmtBtu(x.btus)+(x.local?' · '+esc(x.local):'')+'</span></span></label>').join('')+'</div><div class="muted" style="margin-top:8px">Capacidade total do plano: <b id="btutot">'+fmtBtu(list.filter(x=>sel.has(x.id)).reduce((s,x)=>s+(x.btus||0),0))+'</b></div>':'<div class="sectionnote">Este cliente ainda não tem equipamentos. Cadastre na aba Equipamentos e volte aqui.</div>';
  };
  const drawTasks=()=>{$('#pmoctasks').innerHTML=tarefas.map((t,i)=>'<div class="taskrow"><input data-ti="'+i+'" data-tk="desc" value="'+esc(t.desc)+'" placeholder="Tarefa" aria-label="Tarefa"><select data-ti="'+i+'" data-tk="freq" aria-label="Frequência">'+FREQ.map(f=>'<option'+(t.freq===f?' selected':'')+'>'+f+'</option>').join('')+'</select><button class="btn small danger" data-trm="'+i+'" type="button" aria-label="Remover tarefa">×</button></div>').join('')};
  const recalc=()=>{$('#f-proxima').value=nextFrom($('#f-ultima').value||v.criado||today(),$('#f-periodo').value)};
  $('#f-cliente').onchange=()=>{sel.clear();drawEq()};
  $('#equipchecks').addEventListener('change',ev=>{const id=ev.target.dataset.eq;if(!id)return;ev.target.checked?sel.add(id):sel.delete(id);const b=$('#btutot');if(b)b.textContent=fmtBtu(db.equipamentos.filter(x=>sel.has(x.id)).reduce((s,x)=>s+(x.btus||0),0))});
  $('#pmoctasks').addEventListener('input',ev=>{const t=ev.target;if(t.dataset.ti!=null)tarefas[+t.dataset.ti][t.dataset.tk]=t.value});
  $('#pmoctasks').addEventListener('change',ev=>{const t=ev.target;if(t.dataset.ti!=null)tarefas[+t.dataset.ti][t.dataset.tk]=t.value});
  $('#pmoctasks').addEventListener('click',ev=>{const b=ev.target.closest('[data-trm]');if(b){tarefas.splice(+b.dataset.trm,1);drawTasks()}});
  $('#addtask').onclick=()=>{tarefas.push({desc:'',freq:'Mensal'});drawTasks()};
  $('#f-periodo').onchange=recalc;$('#f-ultima').onchange=recalc;
  drawEq();drawTasks();
 }});
}
function pmocDoc(pl){
 const c=client(pl.clienteId),eq=pmocEquips(pl),btu=btuSum(pl),rec=pmocRecords(pl);
 return '<div class="doc">'+companyHead('<div class="doctitle">PMOC</div><b>'+esc(pl.numero)+'</b><div class="docsm">Elaborado em '+date(pl.criado)+'</div>')+
 '<div class="docgrid"><div><small class="lb">Local atendido</small><b>'+esc(c?.nome||'—')+'</b>'+(c?.documento?'<div>'+esc(c.documento)+'</div>':'')+(c?.endereco?'<div>'+esc(c.endereco)+'</div>':'')+(pl.ambiente?'<div class="docsm">'+esc(pl.ambiente)+'</div>':'')+((pl.contato||c?.telefone)?'<div class="docsm">Contato: '+esc(pl.contato||c.telefone)+'</div>':'')+'</div>'+
 '<div><small class="lb">Responsável técnico</small><b>'+esc(pl.rtNome||'—')+'</b><div>'+esc(pl.rtCons)+(pl.rtReg?' '+esc(pl.rtReg):'')+'</div>'+(pl.rtNum?'<div>'+esc(pl.rtTipo)+' '+esc(pl.rtNum)+'</div>':'<div class="docsm">'+esc(pl.rtTipo)+' não informado</div>')+'</div></div>'+
 '<div class="docsec"><h4>Equipamentos</h4><div class="tablewrap"><table><thead><tr><th>Ambiente</th><th>Equipamento</th><th class="r">BTU/h</th><th class="r">Ocupantes</th></tr></thead><tbody>'+(eq.length?eq.map(x=>'<tr><td>'+esc(x.local||'—')+'</td><td>'+esc([x.nome,x.tipo,x.marca,x.modelo].filter(Boolean).join(' · '))+'</td><td class="r">'+(x.btus?fq(x.btus):'—')+'</td><td class="r">'+(x.ocup?fq(x.ocup):'—')+'</td></tr>').join(''):'<tr><td colspan="4">Nenhum equipamento no plano.</td></tr>')+'</tbody></table></div><div class="docsm" style="margin-top:6px">Capacidade total: <b>'+fq(btu)+' BTU/h</b> ('+fq(Math.round(btu/12000*10)/10)+' TR)'+(btu>60000?' · acima de 60.000 BTU/h':'')+'</div></div>'+
 '<div class="docsec"><h4>Plano de manutenção</h4><div class="docsm" style="margin-bottom:6px">Periodicidade das visitas: <b>'+esc(pl.periodo)+'</b> · Próxima prevista: <b>'+date(pl.proxima)+'</b></div><div class="tablewrap"><table><thead><tr><th>Tarefa</th><th class="r">Frequência</th></tr></thead><tbody>'+pl.tarefas.map(t=>'<tr><td>'+esc(t.desc)+'</td><td class="r">'+esc(t.freq)+'</td></tr>').join('')+'</tbody></table></div></div>'+
 '<div class="docsec"><h4>Registro de manutenções</h4><div class="tablewrap"><table><thead><tr><th class="r">Data</th><th>Técnico</th><th>Atividades</th><th>Peças</th><th>Não conformidades</th></tr></thead><tbody>'+(rec.length?rec.map(h=>'<tr><td class="r">'+date(h.data)+'</td><td>'+esc(h.tecnico||'—')+'</td><td>'+esc([(h.feitas||[]).join('; '),h.obs].filter(Boolean).join(' | ')||h.titulo)+'</td><td>'+esc(h.pecas||'—')+'</td><td>'+esc(h.nc||'—')+'</td></tr>').join(''):'<tr><td colspan="5">Nenhuma manutenção registrada ainda.</td></tr>')+'</tbody></table></div></div>'+
 (pl.obs?'<div class="docsec"><h4>Observações</h4><div style="white-space:pre-line;overflow-wrap:anywhere">'+esc(pl.obs)+'</div></div>':'')+
 '<div class="docsig"><div>'+esc(pl.rtNome||'Responsável técnico')+'<br><span class="docsm">'+esc(pl.rtCons)+(pl.rtReg?' '+esc(pl.rtReg):'')+(pl.rtNum?' · '+esc(pl.rtTipo)+' '+esc(pl.rtNum):'')+'</span></div></div>'+
 '<div class="docnote">Documento de apoio. O plano deve ser revisado e assinado pelo responsável técnico habilitado.</div></div>';
}
function pmocResumo(pl){
 const c=client(pl.clienteId),L=[];
 L.push('*'+pl.numero+' - PMOC*'+(db.empresa.nome?' - '+db.empresa.nome:''));
 L.push('Local: '+(c?.nome||'-')+(c?.endereco?' ('+c.endereco+')':''));
 L.push('Equipamentos: '+pmocEquips(pl).length+' | Capacidade: '+fq(btuSum(pl))+' BTU/h');
 L.push('Periodicidade: '+pl.periodo+' | Próxima manutenção: '+date(pl.proxima));
 if(pl.rtNome)L.push('Responsável técnico: '+pl.rtNome+' ('+pl.rtCons+(pl.rtReg?' '+pl.rtReg:'')+')');
 L.push('','Plano:');pl.tarefas.forEach(t=>L.push('- '+t.desc+' ('+t.freq+')'));
 return L.join('\n');
}
function viewPmoc(pl){
 if(!pl)return;
 modal({title:pl.numero+' · '+pl.titulo,wide:true,cancel:'Fechar',body:pmocDoc(pl),
 actions:[{label:'Registrar manutenção',cls:'primary',fn:()=>recordForm(pl)},
  {label:'Enviar PDF',fn:()=>deliver(()=>pmocPdf(pl),pl.numero+'.pdf','share',pl.numero+' - '+pl.titulo,pmocResumo(pl))},
  {label:'Baixar PDF',fn:()=>deliver(()=>pmocPdf(pl),pl.numero+'.pdf','save')},
  {label:'Copiar resumo',fn:()=>copyText(pmocResumo(pl),'Resumo copiado.')},
  {label:'Editar',fn:()=>pmocForm(pl)},{label:'Excluir',cls:'danger',fn:()=>delPmoc(pl)}]});
}
function delPmoc(pl){
 if(!pl)return;const n=pmocRecords(pl).length;
 confirmBox('Excluir o plano <b>'+esc(pl.numero+' · '+pl.titulo)+'</b>?'+(n?' Os '+n+' registro(s) de manutenção dele continuam no Histórico.':''),'Excluir plano',()=>{
  db.historico.forEach(h=>{if(h.pmocId===pl.id)h.pmocId=''});
  db.pmocs=db.pmocs.filter(x=>x.id!==pl.id);persist();render();notify('Plano excluído.')});
}
function recordForm(pl){
 if(!pl)return;
 const eq=pmocEquips(pl),n=pmocRecords(pl).length,base=MONTHS[pl.periodo]||1;
 const due=t=>{if(n===0)return true;const r=Math.max(1,Math.ceil((MONTHS[t.freq]||1)/base));return (n+1)%r===0};
 modal({title:'Registrar manutenção',wide:true,body:
 '<div class="sectionnote">O registro entra no histórico e atualiza a próxima data do plano. Marquei as tarefas que costumam vencer nesta visita. Ajuste se precisar.</div>'+
 '<div class="formgrid">'+fi('Data *','f-data',today(),'type="date"')+fi('Técnico','f-tecnico',pl.rtNome)+
 fs('Equipamento','f-equip',[['','Todos os equipamentos do plano'],...eq.map(e=>[e.id,e.nome])],'',true)+'</div>'+
 '<h4 class="formh">Tarefas executadas</h4><div class="checks">'+pl.tarefas.map((t,i)=>'<label class="check"><input type="checkbox" data-ti="'+i+'"'+(due(t)?' checked':'')+'><span>'+esc(t.desc)+' <span class="muted">· '+esc(t.freq)+'</span></span></label>').join('')+'</div>'+
 '<div class="formgrid" style="margin-top:14px">'+ft('Outras atividades, medições e observações','f-extra','',true)+ft('Peças substituídas','f-pecas','',true)+ft('Não conformidades encontradas','f-nc','',true)+fi('Próxima manutenção','f-proxima',nextFrom(today(),pl.periodo),'type="date"')+'</div>',
 actions:[{label:'Salvar registro',cls:'primary',fn:()=>{
  const data=$('#f-data').value;if(!data)return notify('Informe a data.');
  const feitas=$$('#modalbody [data-ti]').filter(c=>c.checked).map(c=>pl.tarefas[+c.dataset.ti].desc),extra=$('#f-extra').value.trim();
  if(!feitas.length&&!extra)return notify('Marque as tarefas feitas ou descreva a atividade.');
  db.historico.push({id:uid(),clienteId:pl.clienteId,equipamentoId:$('#f-equip').value,titulo:'Manutenção preventiva ('+pl.periodo.toLowerCase()+')',data,tecnico:$('#f-tecnico').value.trim(),obs:extra,pecas:$('#f-pecas').value.trim(),nc:$('#f-nc').value.trim(),feitas,pmocId:pl.id});
  const r=pmocRecords(pl),last=r[r.length-1].data;pl.ultima=last;pl.proxima=data>=last?($('#f-proxima').value||nextFrom(data,pl.periodo)):nextFrom(last,pl.periodo);
  if(persist()){render();notify('Manutenção registrada!');viewPmoc(pl)}}}],
 onOpen:()=>{$('#f-data').onchange=()=>{$('#f-proxima').value=nextFrom($('#f-data').value||today(),pl.periodo)}}});
}
function delHistory(h){
 if(!h)return;
 confirmBox('Excluir este registro de <b>'+date(h.data)+'</b>? Essa ação não pode ser desfeita.','Excluir registro',()=>{
  db.historico=db.historico.filter(x=>x.id!==h.id);
  const pl=db.pmocs.find(p=>p.id===h.pmocId);if(pl)syncPmoc(pl);
  persist();render();notify('Registro excluído.')});
}

/* ----- empresa e backup ----- */
function collectCompany(){
 const e=db.empresa,g=id=>{const el=$('#'+id);return el?el.value.trim():null},set=(k,id)=>{const v=g(id);if(v!==null)e[k]=v};
 set('nome','co-nome');set('documento','co-doc');set('telefone','co-tel');set('email','co-email');set('endereco','co-end');set('pix','co-pix');set('garantia','co-gar');set('pagamento','co-pag');set('responsavel','co-resp');set('rtCons','co-cons');set('rtReg','co-reg');
 const v=g('co-val');if(v!==null)e.validadeDias=Math.max(1,Number(v)||15);
}
function logoUpload(f){
 if(!f)return;
 if(!f.type.startsWith('image/'))return notify('Selecione uma imagem válida.');
 if(f.size>8*1024*1024)return notify('Imagem muito grande. Use até 8 MB.');
 collectCompany();
 const r=new FileReader();
 r.onload=()=>{const im=new Image();
  im.onload=()=>{const sc=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.empresa.logo=c.toDataURL('image/png');if(persist()){render();notify('Logo salva!')}};
  im.onerror=()=>notify('Não consegui abrir essa imagem.');im.src=r.result};
 r.readAsDataURL(f);
}
function exportBackup(){
 db.meta.lastBackup=new Date().toISOString();persist();
 const blob=new Blob([JSON.stringify({...db,backupDate:db.meta.lastBackup,app:'OrçaFrio'},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='orcafrio-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
 render();notify('Backup exportado!');
}
function importFile(){
 const f=$('#backupfile')?.files[0];if(!f)return notify('Selecione um arquivo de backup.');
 const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(f);
}
function restoreFrom(text){
 let x;try{x=JSON.parse(text);if(!x||!Array.isArray(x.clientes)||!Array.isArray(x.orcamentos))throw Error()}catch{return notify('Arquivo ou texto inválido ou incompatível.')}
 confirmBox('Isso substitui todos os dados atuais pelos do backup. Continuar?','Restaurar',()=>{db=norm(merge(x));if(persist()){render();notify('Backup restaurado!')}});
}

render();
persist();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
